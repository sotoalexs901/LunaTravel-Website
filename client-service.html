<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>Client Service Updates | FreshBorn</title><style>:root{--navy:#0b2d4d;--gold:#dba837;--ink:#17334e;--muted:#64798c;--line:#dce5ed;--green:#14775b;--paper:#fff;--bg:#edf3f7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,sans-serif}header{background:var(--navy);color:white;padding:22px max(5vw,18px);display:flex;align-items:center;justify-content:space-between;gap:18px}header b{font-size:19px}header small{display:block;color:#e7c16a}main{max-width:1180px;margin:auto;padding:28px 24px 60px}h1{font-size:32px;line-height:1.2;margin:8px 0}h2{font-size:23px;margin:0 0 14px}h3{font-size:20px;margin:10px 0}p{margin:10px 0}a{color:#185e91}button,.button{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:10px;padding:11px 16px;background:var(--navy);color:white;font:600 14px system-ui;text-decoration:none;cursor:pointer;min-height:44px}button:disabled{opacity:.45;cursor:default}.secondary{background:#eaf0f5;color:var(--navy)}.gold{background:var(--gold);color:#192e40}.danger{background:#a73737}header button{background:#ffffff1a;border:1px solid #ffffff50}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:24px;margin:0 0 18px}.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:22px;align-items:center}.clock{font-size:38px;font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:-1px}.eyebrow{font-size:12px;letter-spacing:.12em;font-weight:750;color:var(--muted);text-transform:uppercase}.muted,small{color:var(--muted)}header small{color:#e7c16a}.flex{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.badge{display:inline-block;padding:5px 10px;border-radius:20px;background:#eaf0f5;font-size:12px;font-weight:750}.badge.green{background:#e4f4ec;color:#14775b}.badge.amber{background:#fff4d9;color:#87600d}.visit{border-left:5px solid var(--gold)}.timeline{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:18px 0}.step{padding:10px;border-radius:10px;background:#f1f5f8;border-top:3px solid #dce5ed;font-size:12px}.step.done{border-top-color:#14775b;background:#ecf7f1}.step b{display:block;font-size:13px}.note{padding:14px 16px;border-radius:10px;background:#fff6e2;color:#6c531c}.info{padding:14px 16px;border-radius:10px;background:#eef5fa}.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.photo{padding:10px;border:1px solid var(--line);border-radius:12px;overflow:hidden}.photo img{display:block;width:100%;height:170px;object-fit:cover;border-radius:8px}.photo p{font-size:13px;overflow-wrap:anywhere}.photo a{display:block}.photo input{width:auto}.empty{padding:24px;background:#f6f9fb;border:1px dashed #b8c9d6;border-radius:12px;text-align:center;color:var(--muted)}label{display:block;font-weight:600;margin-top:14px}input,select,textarea{font:inherit;max-width:100%;border:1px solid #b6c8d6;border-radius:9px;padding:10px;background:white;color:var(--ink)}label input:not([type=checkbox]),textarea{display:block;width:100%;margin-top:6px}textarea{min-height:105px;resize:vertical}input[type=checkbox]{accent-color:var(--navy)}details{margin:14px 0}summary{cursor:pointer;font-weight:650;padding:10px 0}.status{white-space:pre-wrap;overflow-wrap:anywhere}.status:not(:empty){background:#e8f1f8;padding:12px 16px;border-radius:10px;margin:14px 0}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}footer{color:var(--muted);font-size:13px;text-align:center;margin-top:24px}.pre{white-space:pre-wrap;overflow-wrap:anywhere}#clockStatus{font-weight:650}[hidden]{display:none!important}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #dba837;outline-offset:3px}@media(max-width:720px){main{padding:20px 14px 40px}.card{padding:19px}.hero,.grid{grid-template-columns:1fr}h1{font-size:27px}.timeline{grid-template-columns:repeat(2,minmax(0,1fr))}.photos{grid-template-columns:repeat(2,minmax(0,1fr))}.photo img{height:145px}header{padding:18px}header b{font-size:16px}.clock{font-size:34px}}@media(max-width:380px){.photos{grid-template-columns:1fr}}</style><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" sizes="180x180" href="/assets/app-icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="FreshBorn"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="stylesheet" href="/css/mobile.css"><meta name="theme-color" content="#092a4c"></head><body><header><div><b>FreshBorn Cleaning Services</b><small>A Fresh Start for Every Space</small></div><button id="out" type="button">Sign out</button></header><main><p class="eyebrow">VIP SERVICE UPDATES</p><div class="flex"><div><h1>Your cleaning visits</h1><p class="muted">Follow service progress and view reports shared by FreshBorn.</p></div><button id="refresh" class="secondary">Refresh</button></div><p id="status" class="status" role="status">Loading your visits…</p><div id="visits"></div><footer><a href="/privacy.html">Privacy Policy</a> · <a href="/terms.html">Terms &amp; Conditions</a><br>FreshBorn Cleaning Services · Tampa Bay</footer></main><script type="module">import{initializeApp,getApps}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';import{getAuth,onAuthStateChanged,signOut,signInWithEmailAndPassword}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';import{firebaseConfig}from'/assets/firebase-config.js';const app=getApps()[0]||initializeApp(firebaseConfig),auth=getAuth(app),$=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function call(payload){if(!auth.currentUser)throw Error('Please sign in again');const token=await auth.currentUser.getIdToken();const r=await fetch('/.netlify/functions/service-operations',{method:'POST',headers:{'Content-Type':'application/json',authorization:'Bearer '+token},body:JSON.stringify(payload)});let d;try{d=await r.json()}catch{throw Error('Service response unavailable. Refresh before retrying.')}if(!r.ok)throw Error(d.error||'Request failed');return d;}
const when=s=>s?new Date(s).toLocaleString('en-US',{timeZone:'America/New_York',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'—';
const stateLabel={scheduled:'Scheduled',en_route:'On the way',arrived:'Arrived',in_progress:'Cleaning in progress',completed:'Service completed',cancelled:'Cancelled'};
const reviewLabel={draft:'Draft',submitted:'Awaiting admin review',changes_requested:'Changes requested',approved:'Approved & shared'};
const badge=v=>'<span class="badge '+(v==='completed'||v==='approved'?'green':v==='submitted'||v==='changes_requested'?'amber':'')+'">'+esc(stateLabel[v]||reviewLabel[v]||v||'Draft')+'</span>';
function timeline(v){return '<div class="timeline">'+[['enRouteAt','On the way'],['arrivedAt','Arrived'],['serviceStartedAt','Service started'],['completedAt','Completed']].map(([f,label])=>'<div class="step '+(v[f]?'done':'')+'"><b>'+label+'</b>'+when(v[f])+'</div>').join('')+'</div>';}

let loading=false;function render(d){$('visits').innerHTML=d.visits.map(v=>`<article class="card visit"><div class="flex"><p class="eyebrow">${esc(v.date)} · ${esc(v.startTime)}${v.endTime?'–'+esc(v.endTime):''}</p>${badge(v.status)}</div><h3><span translate="no">${esc(v.customerName||'Your cleaning visit')}</span></h3><p><span translate="no">${esc(v.address||'')}</span> <span translate="no">${esc(v.zip||'')}</span></p><p class="muted"><span translate="no">${esc(v.services||'')}</span></p>${timeline(v)}${v.report?`<h3>Your service report</h3><p class="pre">${esc(v.report.summary)}</p><p class="muted">Shared by FreshBorn · ${when(v.report.approvedAt)}</p><div class="photos">${v.photos.map(p=>`<div class="photo">${p.url?`<a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer"><img translate="no" src="${esc(p.url)}" loading="lazy" alt="${esc(p.caption||p.kind+' service photo')}"></a>`:'<p>'+esc(p.previewError)+'</p>'}<p><b>${esc(p.kind)}</b><br><span translate="no">${esc(p.caption)}</span></p></div>`).join('')}</div>`:'<p class="info">Any service report and photos will appear here after FreshBorn reviews and shares them.</p>'}</article>`).join('')||'<div class="empty">No service visits scheduled yet.</div>';}
async function load(){if(loading||!auth.currentUser)return;loading=true;try{render(await call({action:'client-service-dashboard'}));$('status').textContent='Updated '+new Date().toLocaleTimeString()+'. Refreshes every 30 seconds while open.';}catch(e){$('status').textContent=e.message}finally{loading=false;}}
$('refresh').onclick=load;$('out').onclick=async()=>{await signOut(auth);location.replace('/');};onAuthStateChanged(auth,u=>{if(!u){$('status').textContent='Open this page after signing into your FreshBorn client account.';$('visits').innerHTML='<p><a href="/">Return to FreshBorn</a></p>';return;}load();});setInterval(()=>{if(!document.hidden)load();},30000);
</script><script type="module" src="/assets/freshborn-app.js"></script></body></html>
