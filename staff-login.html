<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Login | FreshBorn</title><style>body{font:16px system-ui;margin:0;background:#eef4f8;color:#092a4c}.card{max-width:460px;margin:10vh auto;background:#fff;padding:28px;border-radius:18px}input,button{width:100%;padding:12px;margin:7px 0;box-sizing:border-box}button{background:#092a4c;color:#fff;border:0;border-radius:8px}</style></head><body><div class="card"><h1>FreshBorn Staff</h1><form id="f"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button>Sign in</button></form><p id="status"></p></div><script type="module">import{initializeApp,getApps}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';import{getAuth,signInWithEmailAndPassword}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';import{firebaseConfig}from'/assets/firebase-config.js';const app=getApps()[0]||initializeApp(firebaseConfig),auth=getAuth(app),$=x=>document.getElementById(x);$('f').onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);location.replace('/staff-portal.html')}catch(err){$('status').textContent=err.message}};</script></body></html>
