<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FreshBorn | Admin Dashboard</title><link rel="stylesheet" href="/css/admin.css"></head><body><header><div><strong>FreshBorn</strong> <span>Admin Dashboard</span></div><a href="/">← Public website</a></header><main><section id="loginPanel" class="panel"><h1>Administrator sign in</h1><p>Authorized FreshBorn staff only.</p><form id="loginForm"><label>Email<input type="email" id="adminEmail" required autocomplete="username"></label><label>Password<input type="password" id="adminPassword" required autocomplete="current-password"></label><button type="submit">Sign in</button></form><p id="loginError" role="alert"></p></section><section id="dashboard" hidden><div class="heading"><div><h1>Quote requests</h1><p>Incoming requests from the FreshBorn website</p></div><button id="logout">Sign out</button></div><div class="stats"><div><small>Total requests</small><strong id="total">0</strong></div><div><small>New requests</small><strong id="newCount">0</strong></div></div><div class="panel"><div class="toolbar"><input id="search" placeholder="Search name, email, phone, ZIP" aria-label="Search requests"><button id="refresh">Refresh</button></div><p id="dashboardStatus" role="status"></p><div class="tableWrap"><table><thead><tr><th>Received</th><th>Name</th><th>Phone</th><th>Email</th><th>Property</th><th>ZIP</th><th>Frequency</th><th>Preferred date</th><th>Status</th><th>Details</th></tr></thead><tbody id="requestsBody"></tbody></table></div></div></section></main><script type="module" src="/assets/admin.js"></script></body></html>
