<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff & Scheduling | FreshBorn</title><style>:root{--n:#092a4c;--g:#dca318}body{font:15px system-ui;margin:0;background:#eef4f8;color:var(--n)}header{background:var(--n);color:#fff;padding:18px 4%}main{max-width:1150px;margin:auto;padding:24px}.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}input,select,textarea,button{padding:10px;margin:5px 0;box-sizing:border-box}input,select,textarea{width:100%}button{background:var(--n);color:white;border:0;border-radius:8px}.row{display:grid;grid-template-columns:2fr 2fr 1fr;gap:10px;border-top:1px solid #eee;padding:12px 0}@media(max-width:720px){.grid,.row{grid-template-columns:1fr}}</style></head><body><header><b>FreshBorn · Staff & Scheduling</b></header><main><section id="login" class="card"><h1>Administrator sign in</h1><form id="lf"><input id="ae" type="email" placeholder="Admin email" required><input id="ap" type="password" placeholder="Password" required><button>Sign in</button></form><p id="ls"></p></section><section id="dash" hidden><div class="grid"><div class="card"><h2>Invite staff</h2><form id="invite"><input id="sn" placeholder="Employee name" required><input id="se" type="email" placeholder="Employee email" required><button>Send account invitation</button></form><p id="is"></p></div><div class="card"><h2>Staff accounts</h2><div id="staff"></div></div></div><div class="card"><h2>Pending staff invitations</h2><p style="color:#62758a">Email provider acceptance is not the same as inbox delivery. You can resend or copy a fresh invitation link here.</p><div id="invites"></div></div><div class="card"><h2>Assign customers</h2><div id="customers"></div></div><div class="card"><h2>Schedule visit</h2><form id="sched" class="grid"><label>Customer<select id="vc" required></select></label><label>Date<input id="vd" type="date" required></label><label>Start<input id="vs" type="time" required></label><label>End<input id="ve" type="time"></label><label style="grid-column:1/-1">Notes<textarea id="vn"></textarea></label><button>Create scheduled visit</button></form><p id="ss"></p></div><div class="card"><h2>Scheduled visits</h2><div id="visits"></div></div></section></main><script type="module">import{initializeApp,getApps}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';import{getAuth,onAuthStateChanged,signInWithEmailAndPassword}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';import{firebaseConfig}from'/assets/firebase-config.js';const app=getApps()[0]||initializeApp(firebaseConfig),auth=getAuth(app),$=x=>document.getElementById(x);let staff=[],customers=[],invites=[];async function call(payload){const t=await auth.currentUser.getIdToken();const r=await fetch('/.netlify/functions/service-operations',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+t},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){const [a,b,c,d]=await Promise.all([call({action:'admin-list-staff'}),call({action:'admin-list-customers'}),call({action:'admin-list-visits'}),call({action:'admin-list-staff-invites'})]);staff=a.staff;customers=b.customers;invites=d.invites||[];$('staff').innerHTML=staff.map(s=>`<p><b>${esc(s.name||s.email)}</b> · ${esc(s.email)} · ${esc(s.status)}</p>`).join('')||'No staff yet.';$('invites').innerHTML=invites.filter(i=>!i.usedAt).map(i=>`<div class="row"><div><b>${esc(i.name)}</b><br>${esc(i.email)}<br><small>${i.emailProviderStatus==='accepted'?'Accepted by email provider':'Pending'}${i.resendEmailId?' · ID '+esc(i.resendEmailId):''}</small></div><div><small>Expires: ${i.expiresAt?new Date(i.expiresAt).toLocaleString():'—'}</small></div><div><button type="button" data-resend="${i.id}">Resend</button></div></div>`).join('')||'No pending invitations.';document.querySelectorAll('[data-resend]').forEach(b=>b.onclick=async()=>{try{b.disabled=true;const out=await call({action:'admin-resend-staff-invite',inviteId:b.dataset.resend});$('is').textContent='Invitation re-sent. Email provider accepted it.'+(out.emailId?' ID: '+out.emailId:'');if(out.inviteUrl&&navigator.clipboard){await navigator.clipboard.writeText(out.inviteUrl);$('is').textContent+=' Fresh invitation link copied.'}await load()}catch(e){$('is').textContent=e.message}finally{b.disabled=false}});$('customers').innerHTML=customers.map(c=>`<div class="row"><div><b>${esc(c.name)}</b><br>${esc(c.customerNumber)}<br>${esc(c.address||'Address pending')} ${esc(c.zip||'')}</div><div>${esc(c.quoteServices||'')}</div><div><select data-assign="${c.id}"><option value="">Unassigned</option>${staff.map(s=>`<option value="${s.uid}" ${c.assignedStaffUid===s.uid?'selected':''}>${esc(s.name||s.email)}</option>`).join('')}</select></div></div>`).join('');document.querySelectorAll('[data-assign]').forEach(x=>x.onchange=async()=>{await call({action:'admin-assign-customer',customerId:x.dataset.assign,staffUid:x.value});load()});$('vc').innerHTML='<option value="">Select customer</option>'+customers.filter(c=>c.assignedStaffUid).map(c=>`<option value="${c.id}">${esc(c.name)} · ${esc(c.assignedStaffName)}</option>`).join('');$('visits').innerHTML=c.visits.map(v=>`<p><b>${esc(v.date)} ${esc(v.startTime)}</b> · ${esc(v.customerName)} · ${esc(v.assignedStaffName)} · ${esc(v.status)}</p>`).join('')||'No visits scheduled.'}$('lf').onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$('ae').value,$('ap').value);load()}catch(err){$('ls').textContent=err.message}};$('invite').onsubmit=async e=>{e.preventDefault();try{const out=await call({action:'admin-send-staff-invite',name:$('sn').value,email:$('se').value});$('is').textContent='Invitation accepted by email provider.'+(out.emailId?' Resend ID: '+out.emailId:'');if(out.inviteUrl&&navigator.clipboard){await navigator.clipboard.writeText(out.inviteUrl);$('is').textContent+=' Invitation link copied as backup.'}$('invite').reset();await load()}catch(err){$('is').textContent=err.message}};$('sched').onsubmit=async e=>{e.preventDefault();try{await call({action:'admin-create-visit',customerId:$('vc').value,date:$('vd').value,startTime:$('vs').value,endTime:$('ve').value,notes:$('vn').value});$('ss').textContent='Visit scheduled.';$('sched').reset();load()}catch(err){$('ss').textContent=err.message}};onAuthStateChanged(auth,u=>{if(u){$('login').hidden=true;$('dash').hidden=false;load().catch(e=>$('ls').textContent=e.message)}});</script></body></html>
