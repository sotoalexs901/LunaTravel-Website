<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Staff Account | FreshBorn</title><style>body{font:16px system-ui;margin:0;background:#eef4f8;color:#092a4c}.card{max-width:520px;margin:8vh auto;background:#fff;padding:28px;border-radius:18px}input,button{width:100%;padding:12px;margin:7px 0;box-sizing:border-box}button{background:#092a4c;color:#fff;border:0;border-radius:8px}</style></head><body><div class="card"><h1>Create staff account</h1><p>Use the same email address that received the FreshBorn invitation.</p><form id="f"><input id="name" placeholder="Full name" required><input id="email" type="email" placeholder="Email" required><input id="password" type="password" minlength="8" placeholder="Password" required><button>Create account</button></form><p id="status"></p></div><script type="module">import{initializeApp,getApps}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';import{getAuth,createUserWithEmailAndPassword,updateProfile}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';import{firebaseConfig}from'/assets/firebase-config.js';const app=getApps()[0]||initializeApp(firebaseConfig),auth=getAuth(app),q=new URLSearchParams(location.search),inviteId=q.get('invite'),token=q.get('token'),$=x=>document.getElementById(x);$('f').onsubmit=async e=>{e.preventDefault();$('status').textContent='Creating account...';try{const c=await createUserWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);await updateProfile(c.user,{displayName:$('name').value.trim()});const idToken=await c.user.getIdToken();const r=await fetch('/.netlify/functions/service-operations',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+idToken},body:JSON.stringify({action:'activate-staff',inviteId,token})});const d=await r.json();if(!r.ok)throw Error(d.error||'Unable to activate');location.replace('/staff-portal.html')}catch(err){$('status').textContent=err.message}};</script></body></html>
