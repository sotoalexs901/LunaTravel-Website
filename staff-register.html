<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Create Staff Account | FreshBorn</title><style>:root{--n:#092a4c;--g:#dca318;--bg:#eef4f8}*{box-sizing:border-box}body{font:16px system-ui,-apple-system,Segoe UI,sans-serif;margin:0;background:var(--bg);color:var(--n)}.card{max-width:560px;margin:7vh auto;background:#fff;padding:30px;border-radius:20px;box-shadow:0 12px 35px #092a4c18}.eyebrow{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:#8c6a0c;font-weight:800}.emp{background:#f7f1df;border:1px solid #ead391;border-radius:14px;padding:16px;margin:18px 0}.emp small{display:block;color:#6b7783;margin-bottom:5px}.emp strong{font-size:24px;letter-spacing:.6px}label{display:block;font-weight:700;margin-top:12px}input,button{width:100%;padding:12px;margin:7px 0;box-sizing:border-box;border-radius:9px}input{border:1px solid #bdcbd7}input[readonly]{background:#f4f7f9;color:#637688}button{background:var(--n);color:#fff;border:0;font-weight:800}.muted{color:#66798b;font-size:14px}</style><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" sizes="180x180" href="/assets/app-icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="FreshBorn"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="stylesheet" href="/css/mobile.css"><meta name="theme-color" content="#092a4c"></head><body><div class="card"><div class="eyebrow">FreshBorn Cleaning Services</div><h1>Create your staff account</h1><p id="intro">Validating your staff invitation...</p><div class="emp"><small>Your permanent Employee Number</small><strong id="employeeNumber">Loading...</strong></div><form id="f" hidden><label>Full name<input id="name" required></label><label>Work email<input id="email" type="email" readonly required></label><label>Create password<input id="password" type="password" minlength="8" placeholder="Minimum 8 characters" required></label><button>Create Staff Account</button></form><p id="status" class="muted"></p></div><script type="module">import{initializeApp,getApps}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';import{getAuth,createUserWithEmailAndPassword,updateProfile}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';import{firebaseConfig}from'/assets/firebase-config.js';const app=getApps()[0]||initializeApp(firebaseConfig),auth=getAuth(app),q=new URLSearchParams(location.search),inviteId=q.get('invite'),token=q.get('token'),$=x=>document.getElementById(x);async function api(payload,authToken){const r=await fetch('/.netlify/functions/service-operations',{method:'POST',headers:{'content-type':'application/json',...(authToken?{authorization:'Bearer '+authToken}:{})},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)throw Error(d.error||'Unable to process request');return d}async function loadInvite(){try{const d=await api({action:'staff-invite-info',inviteId,token});$('employeeNumber').textContent=d.employeeNumber||'Assigned by FreshBorn';$('name').value=d.name||'';$('email').value=d.email||'';$('intro').textContent='Your FreshBorn staff invitation is ready. This employee number is unique to you and remains your identifier while employed with FreshBorn.';$('f').hidden=false}catch(e){$('employeeNumber').textContent='Unavailable';$('intro').textContent='This invitation cannot be used.';$('status').textContent=e.message}}loadInvite();$('f').onsubmit=async e=>{e.preventDefault();$('status').textContent='Creating account...';try{const c=await createUserWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);await updateProfile(c.user,{displayName:$('name').value.trim()});const idToken=await c.user.getIdToken();const d=await api({action:'activate-staff',inviteId,token},idToken);$('status').textContent='Account activated. Employee Number: '+(d.employeeNumber||$('employeeNumber').textContent);setTimeout(()=>location.replace('/staff-portal.html'),500)}catch(err){$('status').textContent=err.message}};</script><script type="module" src="/assets/freshborn-app.js"></script></body></html>
