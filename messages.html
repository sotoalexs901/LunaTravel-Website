<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Team messages | FreshBorn</title><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/assets/app-icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#092a4c"><link rel="stylesheet" href="/css/mobile.css"><link rel="stylesheet" href="/css/team-chat.css"></head>
<body><header><a href="/app.html">FreshBorn</a><h1>Team messages</h1></header><main><p id="chatStatus" role="status">Sign in to use team chat.</p><a id="chatLogin" href="/staff-login.html">Staff sign in</a><section id="chatApp" hidden class="chat-layout"><aside><button id="newChat">New conversation</button><nav id="rooms" aria-label="Conversations"></nav></aside><section class="conversation"><h2 id="roomTitle">Choose a conversation</h2><button id="older" hidden>Older messages</button><div id="messages" role="log" aria-live="polite" aria-relevant="additions" tabindex="0"></div><form id="composer"><label for="messageText">Write a message</label><textarea id="messageText" maxlength="2000" rows="3" required></textarea><button id="send" type="submit">Send</button></form></section></section></main>
<dialog id="newDialog"><form id="createChat"><h2>New conversation</h2><label for="chatType">Private message</label><select id="chatType"><option value="direct">Private message</option><option id="groupOption" value="group">Create group</option></select><label id="groupLabel" hidden>Group name<input id="groupName" maxlength="80"></label><fieldset><legend>Choose teammates</legend><div id="people"></div></fieldset><p id="createError" role="status"></p><button type="submit" id="createButton">Open conversation</button><button type="button" id="cancelCreate">Cancel</button></form></dialog><script type="module" src="/assets/team-chat.js"></script></body></html>
