<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activate Account | FreshBorn</title><style>body{margin:0;font:16px system-ui;background:#edf4f8;color:#102f50}header{padding:20px 6%;background:#092a4c;color:white}header a{color:#f5c64d}main{max-width:510px;margin:8vh auto;background:white;padding:30px;border-radius:16px;box-shadow:0 8px 25px #102f5015}label{display:block;margin:15px 0 5px;font-weight:650}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #b6c6d4;border-radius:8px;font:inherit}button{margin-top:18px;background:#dca318;color:#102f50;border:0;border-radius:8px;padding:12px 20px;font-weight:700;cursor:pointer}button:disabled{opacity:.5}a{color:#075a9a}#status{white-space:pre-wrap}</style></head><body><header><strong>FreshBorn Cleaning Services</strong> · <a href="/">Home</a></header><main><h1>Activate your client account</h1><p>Use the same email address that received your FreshBorn invitation.</p><form id="form"><label>Email</label><input id="email" type="email" autocomplete="email" required><label>Create password</label><input id="password" type="password" autocomplete="new-password" minlength="8" required><button id="submit">Create account</button></form><p id="status" role="status"></p><p>Already registered? <a href="/client-login.html">Client Login</a></p></main><script type="module">import {initializeApp,getApps} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,sendPasswordResetEmail,signOut} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {firebaseConfig} from '/assets/firebase-config.js';
const app=getApps()[0]||initializeApp(firebaseConfig),auth=getAuth(app),$=id=>document.getElementById(id);
async function call(action,extra={}){const user=auth.currentUser;if(!user)throw Error('Sign in required');const token=await user.getIdToken();const r=await fetch('/.netlify/functions/customer-actions',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+token},body:JSON.stringify({action,...extra})});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d;}
const params=new URLSearchParams(location.search);const id=params.get('id'),token=params.get('token');if(!id||!token)$('status').textContent='Invitation link is missing or invalid.';$('form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;$('status').textContent='Activating...';try{if(!id||!token)throw Error('Invitation link is missing');try{await createUserWithEmailAndPassword(auth,$('email').value.trim(),$('password').value)}catch(err){if(err.code==='auth/email-already-in-use'){await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value)}else throw err}const d=await call('activate-account',{id,token});history.replaceState({},'',location.pathname);$('status').textContent='Account activated! Customer number: '+d.customerNumber;location.replace('/client-portal.html')}catch(err){$('status').textContent=err.message;$('submit').disabled=false}};</script></body></html>
