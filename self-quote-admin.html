<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Self Quote Admin | FreshBorn</title><style>body{font:15px system-ui;background:#eef4f8;color:#092a4c;margin:0}main{max-width:1100px;margin:auto;padding:24px}.card{background:white;padding:20px;border-radius:16px;margin-bottom:16px}input,button{padding:9px;margin:4px;box-sizing:border-box}button{background:#092a4c;color:white;border:0;border-radius:7px}.svc{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:8px;margin:8px 0}@media(max-width:750px){.svc{grid-template-columns:1fr}}</style><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" sizes="180x180" href="/assets/app-icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="FreshBorn"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="stylesheet" href="/css/mobile.css"><meta name="theme-color" content="#092a4c"></head><body><main><section id="login" class="card"><h1>Self‑Quote & Analytics Admin</h1><form id="lf"><input id="e" type="email" placeholder="Admin email" required><input id="p" type="password" placeholder="Password" required><button>Sign in</button></form><p id="msg"></p></section><section id="dash" hidden><div class="card"><h2>Today's website activity</h2><p><b id="uv">0</b> unique visitors · <b id="pv">0</b> page views</p></div><div class="card"><h2>Self‑Quote pricing</h2><div id="catalog"></div><button id="add">Add service</button> <button id="save">Save pricing</button><p id="saveMsg"></p></div><div class="card"><h2>Recent self‑quote leads</h2><div id="leads"></div></div></section></main><script type="module">import{initializeApp,getApps}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';import{getAuth,onAuthStateChanged,signInWithEmailAndPassword}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';import{firebaseConfig}from'/assets/firebase-config.js';const app=getApps()[0]||initializeApp(firebaseConfig),auth=getAuth(app),$=x=>document.getElementById(x);let catalog=[];async function api(payload){const t=await auth.currentUser.getIdToken();const r=await fetch('/.netlify/functions/self-quote-actions',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+t},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}function render(){ $('catalog').innerHTML=catalog.map((s,i)=>`<div class="svc"><input data-k="name" data-i="${i}" value="${s.name||''}" placeholder="Service"><input data-k="unitLabel" data-i="${i}" value="${s.unitLabel||'unit'}" placeholder="Unit"><input data-k="price" data-i="${i}" type="number" step="0.01" value="${s.price||0}" placeholder="Price"><input data-k="timeMinutes" data-i="${i}" type="number" value="${s.timeMinutes||0}" placeholder="Minutes"><button data-del="${i}">Remove</button></div>`).join('');document.querySelectorAll('[data-k]').forEach(x=>x.oninput=()=>{const i=+x.dataset.i,k=x.dataset.k;catalog[i][k]=(k==='price'||k==='timeMinutes')?Number(x.value):x.value});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{catalog.splice(+b.dataset.del,1);render()})}async function load(){const [c,a]=await Promise.all([api({action:'admin-get-config'}),api({action:'admin-analytics'})]);catalog=c.catalog;render();$('uv').textContent=a.uniqueVisitors;$('pv').textContent=a.pageViews;$('leads').innerHTML=a.leads.map(x=>`<p><b>${x.name||''}</b> · ${x.email||''} · $${Number(x.total||0).toFixed(2)}/visit · ${x.status||''}</p>`).join('')||'No self-quote leads yet.'}$('lf').onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$('e').value,$('p').value);load()}catch(err){$('msg').textContent=err.message}};$('add').onclick=()=>{catalog.push({id:'svc'+Date.now(),name:'New service',unitLabel:'unit',price:0,timeMinutes:0,max:100,active:true});render()};$('save').onclick=async()=>{try{await api({action:'admin-save-config',catalog});$('saveMsg').textContent='Pricing saved.'}catch(e){$('saveMsg').textContent=e.message}};onAuthStateChanged(auth,u=>{if(u){$('login').hidden=true;$('dash').hidden=false;load().catch(e=>$('msg').textContent=e.message)}});</script><script type="module" src="/assets/freshborn-app.js"></script></body></html>
