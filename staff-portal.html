<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Portal | FreshBorn</title><style>:root{--n:#092a4c;--g:#dca318}body{font:15px system-ui;margin:0;background:#eef4f8;color:var(--n)}header{background:var(--n);color:white;padding:18px 5%;display:flex;justify-content:space-between}main{max-width:1100px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{background:white;border-radius:16px;padding:20px;margin-bottom:16px}.visit{border-left:5px solid var(--g)}button{padding:9px 12px;border:0;border-radius:8px;background:var(--n);color:#fff}.muted{color:#687b8d}input{max-width:100%}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header><b>FreshBorn · Staff Portal</b><button id="out">Sign out</button></header><main><h1 id="welcome">Welcome</h1><p id="employeeId" class="muted"></p><p id="status">Loading...</p><h2>My schedule</h2><div id="visits"></div><h2>My assigned customers</h2><div id="customers" class="grid"></div></main><script type="module">import{initializeApp,getApps}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';import{getAuth,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';import{firebaseConfig}from'/assets/firebase-config.js';const app=getApps()[0]||initializeApp(firebaseConfig),auth=getAuth(app),$=x=>document.getElementById(x);$('out').onclick=()=>signOut(auth).then(()=>location.replace('/staff-login.html'));async function call(payload){const t=await auth.currentUser.getIdToken();const r=await fetch('/.netlify/functions/service-operations',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+t},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){const d=await call({action:'staff-dashboard'});$('welcome').textContent='Welcome back, '+(d.staff.name||'Staff');$('employeeId').textContent=d.staff.employeeNumber?'Employee Number: '+d.staff.employeeNumber:'';$('status').textContent='';$('customers').innerHTML=d.customers.map(c=>`<div class="card"><b>${esc(c.name)}</b><p>${esc(c.customerNumber||'')}</p><p>${esc(c.address||'Address pending')} ${esc(c.zip||'')}</p><p class="muted">${esc(c.quoteServices||'')}</p></div>`).join('')||'<div class="card">No customers assigned yet.</div>';$('visits').innerHTML=d.visits.map(v=>`<div class="card visit"><b>${esc(v.date)} · ${esc(v.startTime)}${v.endTime?'–'+esc(v.endTime):''}</b><h3>${esc(v.customerName)}</h3><p>${esc(v.address||'Address pending')} ${esc(v.zip||'')}</p><p>${esc(v.services||'')}</p><p>Status: <b>${esc(v.status)}</b></p><div>${v.status!=='completed'?`<button data-complete="${v.id}">Mark completed</button>`:''} <label><input type="file" accept="image/jpeg,image/png,image/webp" data-photo="${v.id}"></label></div><p id="m-${v.id}" class="muted"></p></div>`).join('')||'<div class="card">No visits scheduled yet.</div>';document.querySelectorAll('[data-complete]').forEach(b=>b.onclick=async()=>{await call({action:'staff-complete-visit',visitId:b.dataset.complete});load()});document.querySelectorAll('[data-photo]').forEach(i=>i.onchange=async()=>{const f=i.files[0];if(!f)return;if(f.size>2*1024*1024){alert('Photo must be 2 MB or smaller');return}const rd=new FileReader();rd.onload=async()=>{const m=$('m-'+i.dataset.photo);m.textContent='Uploading...';try{await call({action:'staff-upload-photo',visitId:i.dataset.photo,dataUrl:rd.result,caption:'Service photo'});m.textContent='Photo uploaded.'}catch(e){m.textContent=e.message}};rd.readAsDataURL(f)})}onAuthStateChanged(auth,u=>{if(!u){location.replace('/staff-login.html');return}load().catch(e=>$('status').textContent=e.message)});</script></body></html>
