<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Staff Alerts | FreshBorn</title><style>body{margin:0;background:#edf3f7;color:#17334e;font:16px/1.6 system-ui,sans-serif}header{background:#092a4c;color:white;padding:24px 6%}header a{color:white;text-decoration:none;font-weight:750}main{max-width:900px;margin:30px auto;padding:0 24px 50px}h1{font-size:clamp(28px,5vw,42px);line-height:1.15}h2{font-size:20px}p{color:#5e7488}.app-card{background:white;border:1px solid #dce5ed;border-radius:20px;padding:26px;margin-bottom:18px}.app-links{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.app-links a,.app-button{display:block;text-decoration:none;border-radius:12px;padding:18px;background:#092a4c;color:white;font-weight:700}.app-links small{display:block;color:#d7e5ef;font-weight:400;margin-top:5px}.app-logo{max-width:220px;display:block;margin:auto}.app-gold{background:#dca318;color:#18344d}.notification{border-left:4px solid #dca318}.notification.read{border-left-color:#ccd9e4}.notification time{font-size:13px;color:#698195}.notification button{background:#092a4c;color:white;border:0;border-radius:9px;padding:11px 16px;font:600 14px system-ui;cursor:pointer}.notification p{white-space:pre-wrap}.app-status{padding:12px 0}button.app-button{border:0;font:inherit;cursor:pointer}@media(max-width:650px){.app-links{grid-template-columns:1fr}main{margin:20px auto;padding:0 14px}.app-card{padding:21px}.app-logo{max-width:170px}}</style><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" sizes="180x180" href="/assets/app-icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="FreshBorn"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="stylesheet" href="/css/mobile.css"><meta name="theme-color" content="#092a4c"></head><body><header><a href="/">FreshBorn Cleaning Services</a></header><main><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><div><h1>Your alerts</h1><p>Assignments from FreshBorn, all in one place.</p></div><button id="inboxRefresh" class="app-button">Refresh</button></div><p id="inboxStatus" class="app-status" role="status">Sign in with your staff account to see alerts.</p><div id="inboxItems"></div><p><small>Shows your latest 50 alerts. Push settings apply only to this device.</small></p></main><script type="module">import{appApi,refreshInbox}from'/assets/freshborn-app.js';const status=document.getElementById('inboxStatus'),items=document.getElementById('inboxItems');function render(data){items.replaceChildren();status.textContent=data.items.length?data.unread+' unread in your latest alerts.':'No alerts yet. New assignments will appear here.';for(const item of data.items){const card=document.createElement('article');card.className='app-card notification'+(item.readAt?' read':'');const h=document.createElement('h2');h.textContent=item.title;const t=document.createElement('time');t.textContent=item.createdAt?new Date(item.createdAt).toLocaleString():'';const p=document.createElement('p');p.textContent=item.body;const button=document.createElement('button');button.textContent=item.type==='chat_message'?'Open conversation':'Open assignment';button.onclick=async()=>{button.disabled=true;try{await appApi('mark-read',{id:item.id});let url=new URL(item.url,location.origin);if(url.origin!==location.origin||!['/staff-portal.html','/messages.html'].includes(url.pathname))url=new URL('/staff-portal.html',location.origin);location.assign(url.href);}catch(e){status.textContent=e.message;button.disabled=false;}};card.append(h,t,p,button);items.append(card);}}window.addEventListener('freshborn:inbox',e=>render(e.detail));window.addEventListener('freshborn:profile',e=>{if(!['staff','super_admin'].includes(e.detail?.role)){items.replaceChildren();status.textContent='Sign in with an active staff account to see your alerts.';}});document.getElementById('inboxRefresh').onclick=async()=>{try{await refreshInbox()}catch(e){status.textContent=e.message;}};</script><script type="module" src="/assets/freshborn-app.js"></script></body></html>
