<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Client Login | FreshBorn</title><style>body{margin:0;font:16px system-ui;background:#edf4f8;color:#102f50}header{padding:20px 6%;background:#092a4c;color:white}header a{color:#f5c64d}main{max-width:510px;margin:8vh auto;background:white;padding:30px;border-radius:16px;box-shadow:0 8px 25px #102f5015}label{display:block;margin:15px 0 5px;font-weight:650}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #b6c6d4;border-radius:8px;font:inherit}button{margin-top:18px;background:#dca318;color:#102f50;border:0;border-radius:8px;padding:12px 20px;font-weight:700;cursor:pointer}button:disabled{opacity:.5}a{color:#075a9a}#status{white-space:pre-wrap}</style><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" sizes="180x180" href="/assets/app-icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="FreshBorn"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="stylesheet" href="/css/mobile.css"><meta name="theme-color" content="#092a4c"></head><body><header><strong>FreshBorn Cleaning Services</strong> · <a href="/">Home</a></header><main><h1>Client Login</h1><p>Access your private FreshBorn customer account.</p><form id="form"><label>Email</label><input id="email" type="email" autocomplete="email" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><button id="submit">Sign In</button></form><p><a href="#" id="reset">Forgot password?</a></p><p id="status" role="status"></p><p>New customer? Check your email for your FreshBorn account invitation.</p></main><script type="module">import {initializeApp,getApps} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,sendPasswordResetEmail,signOut} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {firebaseConfig} from '/assets/firebase-config.js';
const app=getApps()[0]||initializeApp(firebaseConfig),auth=getAuth(app),$=id=>document.getElementById(id);
async function call(action,extra={}){const user=auth.currentUser;if(!user)throw Error('Sign in required');const token=await user.getIdToken();const r=await fetch('/.netlify/functions/customer-actions',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+token},body:JSON.stringify({action,...extra})});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d;}
$('form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;$('status').textContent='Signing in...';try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);location.replace('/client-portal.html')}catch(e){$('status').textContent=e.message;$('submit').disabled=false}};$('reset').onclick=async e=>{e.preventDefault();if(!$('email').value.trim()){ $('status').textContent='Enter your email address first.';return}try{await sendPasswordResetEmail(auth,$('email').value.trim());$('status').textContent='If the account exists, password reset instructions will be sent.'}catch(e){$('status').textContent=e.message}};</script><script type="module" src="/assets/freshborn-app.js"></script></body></html>
