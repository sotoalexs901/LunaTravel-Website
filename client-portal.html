<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account | FreshBorn</title><style>body{margin:0;font:16px system-ui;background:#edf4f8;color:#102f50}header{padding:20px 6%;background:#092a4c;color:white}header a{color:#f5c64d}main{max-width:510px;margin:8vh auto;background:white;padding:30px;border-radius:16px;box-shadow:0 8px 25px #102f5015}label{display:block;margin:15px 0 5px;font-weight:650}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #b6c6d4;border-radius:8px;font:inherit}button{margin-top:18px;background:#dca318;color:#102f50;border:0;border-radius:8px;padding:12px 20px;font-weight:700;cursor:pointer}button:disabled{opacity:.5}a{color:#075a9a}#status{white-space:pre-wrap}</style></head><body><header><strong>FreshBorn Cleaning Services</strong> · <a href="/">Home</a></header><main><h1>My FreshBorn Account</h1><p id="status" role="status">Loading your account...</p><div id="profiles"></div><button id="logout" type="button">Sign Out</button></main><script type="module">import {initializeApp,getApps} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,sendPasswordResetEmail,signOut} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {firebaseConfig} from '/assets/firebase-config.js';
const app=getApps()[0]||initializeApp(firebaseConfig),auth=getAuth(app),$=id=>document.getElementById(id);
async function call(action,extra={}){const user=auth.currentUser;if(!user)throw Error('Sign in required');const token=await user.getIdToken();const r=await fetch('/.netlify/functions/customer-actions',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+token},body:JSON.stringify({action,...extra})});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d;}
$('logout').onclick=async()=>{await signOut(auth);location.replace('/client-login.html')};onAuthStateChanged(auth,async user=>{if(!user){location.replace('/client-login.html');return}try{const d=await call('customer-profile');$('status').textContent=d.profiles.length?'Welcome back!':'No activated customer profile is linked to this email. Please use your invitation link.';const container=$('profiles');container.replaceChildren();for(const r of d.profiles){const box=document.createElement('section');box.style.cssText='border-top:1px solid #d8e1e8;margin-top:20px;padding-top:14px';const fields=[['Customer number',r.customerNumber],['Name',r.name],['Email',r.email],['Property',r.propertyType],['ZIP',r.zip],['Frequency',r.frequency],['Price per visit',r.quotePrice==null?'Pending':'$'+Number(r.quotePrice).toFixed(2)],['Contract',r.contractTerm==='none'?'Flexible':r.contractTerm+' months'],['Included services',r.quoteServices],['Monthly deep cleaning',r.monthlyDeepCleaningIncluded?'Included':'Not included']];for(const [key,val] of fields){const row=document.createElement('p');const strong=document.createElement('strong');strong.textContent=key+': ';row.append(strong,document.createTextNode(String(val??'—')));box.append(row)}container.append(box)}}catch(e){$('status').textContent='Unable to load profile: '+e.message}});</script></body></html>
